<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Check host screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { overflow: hidden; }
  .stage { height: 100vh; display: grid; grid-template-rows: auto 64px 1fr; }
  .bar { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 48px 0; font-size: 20px; color: var(--muted); }
  .bar .event { font-weight: 800; font-stretch: 112%; color: var(--navy); }
  .bar b { color: var(--navy); font-variant-numeric: tabular-nums; }
  .pulse-row { padding: 6px 0; color: var(--navy); }
  main { min-height: 0; padding: 8px 48px 104px; }

  /* setup */
  .setup { height: 100%; overflow: auto; max-width: 1200px; }
  .setup h1 { font-size: 64px; font-weight: 900; font-stretch: 125%; margin: 0 0 8px; line-height: .95; }
  .setup .lede { font-size: 22px; color: var(--muted); margin: 0 0 28px; }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .cat { text-align: left; background: #fff; border: 3px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
  .cat[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }
  .cat .t { font-size: 22px; font-weight: 800; }
  .cat .b { font-size: 16px; color: var(--muted); }
  .cat .n { font-size: 15px; color: var(--muted); margin-top: 6px; }
  .cat[aria-pressed="true"] .n::before { content: "✓ In the game · "; color: var(--a3); font-weight: 700; }
  .opts-row { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; margin: 28px 0; font-size: 20px; }
  .ctl { display: inline-flex; align-items: center; gap: 10px; }
  .ctl small { font-size: 15px; color: var(--muted); }
  .step { display: inline-flex; align-items: center; border: 2px solid var(--navy); border-radius: 999px; overflow: hidden; }
  .step button { background: #fff; border: 0; width: 42px; padding: 8px 0; font-size: 22px; font-weight: 800; line-height: 1; color: var(--navy); }
  .step button:hover:not(:disabled) { background: var(--navy); color: #fff; }
  .step button:disabled { opacity: .3; cursor: default; }
  .step input { width: 62px; border: 0; border-left: 2px solid var(--navy); border-right: 2px solid var(--navy);
    text-align: center; font: inherit; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: var(--navy); background: #fff; padding: 8px 0; -moz-appearance: textfield; }
  .step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .step input:focus { outline: 3px solid var(--pulse); outline-offset: -3px; }
  .seg { display: inline-flex; border: 2px solid var(--navy); border-radius: 999px; overflow: hidden; margin-left: 10px; }
  .seg button { background: #fff; border: 0; padding: 8px 16px; font-weight: 700; }
  .seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
  .toggle { display: inline-flex; align-items: center; gap: 10px; font-size: 20px; }
  .toggle input { width: 22px; height: 22px; accent-color: var(--navy); }
  .create { background: var(--pulse); color: #fff; border: 0; border-radius: 999px; padding: 18px 40px; font-size: 24px; font-weight: 800; }
  .create:disabled { opacity: .5; }
  .summary { font-size: 18px; color: var(--muted); margin-left: 16px; }

  /* lobby */
  .lobby { height: 100%; display: grid; grid-template-columns: minmax(340px, 1fr) minmax(0, 1.2fr); gap: 48px; min-height: 0; }
  .join { display: flex; flex-direction: column; justify-content: center; min-height: 0; min-width: 0; }
  .title { font-size: clamp(44px, 5.6vw, 104px); line-height: .9; font-weight: 900; font-stretch: 125%; margin: 0 0 14px; letter-spacing: -.02em; }
  .lede2 { font-size: clamp(18px, 1.5vw, 24px); line-height: 1.3; margin: 0 0 16px; max-width: 24ch; }
  .qr { background: #fff; padding: 16px; border-radius: 24px; box-shadow: 0 0 0 3px var(--navy); align-self: flex-start; }
  .qr img { display: block; width: clamp(150px, min(30vh, 22vw), 320px); height: auto; }
  .url { font-size: 22px; font-weight: 700; color: var(--a1); margin-top: 14px; word-break: break-all; }
  .wall { display: flex; flex-direction: column; min-height: 0; }
  .count { font-size: 24px; margin: 6px 0 14px; }
  .count b { font-size: 56px; font-stretch: 125%; margin-right: 8px; }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 10px; align-content: start; overflow: hidden; }
  .p { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--navy); }
  .p .nm { font-size: 15px; font-weight: 700; max-width: 104px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p:hover .nm { color: var(--a0); text-decoration: line-through; }
  .p.new .avatar { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
  .empty { font-size: 26px; color: var(--muted); }

  /* cards */
  .card { height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .card .sub { font-size: 30px; color: var(--muted); margin: 0 0 12px; }
  .card .art { color: var(--navy); margin: 0 0 20px; align-self: flex-start; width: clamp(220px, 27vw, 470px); height: auto; }
  .card.brk .art { color: var(--pulse); }
  .card h1 { font-size: clamp(64px, 9vw, 170px); line-height: .9; font-weight: 900; font-stretch: 125%; margin: 0 0 22px; letter-spacing: -.02em; max-width: 14ch; }
  .card p { font-size: 34px; margin: 0; color: var(--muted); max-width: 32ch; line-height: 1.3; }
  .card.brk p { color: var(--navy); font-size: 46px; font-weight: 600; max-width: 26ch; }
  .big-secs { font-size: 120px; font-weight: 900; font-stretch: 125%; color: var(--pulse); margin-top: 28px; font-variant-numeric: tabular-nums; }

  /* question */
  .q { height: 100%; display: grid; grid-template-rows: auto auto 1fr; gap: 22px; }
  .q.reading { grid-template-rows: auto 1fr; }
  .q-meta { display: flex; gap: 22px; align-items: center; font-size: 22px; color: var(--muted); }
  .q-meta .art { color: var(--navy); flex: none; align-self: center; width: clamp(96px, 10vw, 180px); height: auto; }
  .q-meta .ct { font-weight: 800; color: var(--navy); font-size: clamp(24px, 2.1vw, 40px); font-stretch: 112%; }
  .reading .q-meta .art { width: clamp(120px, 13vw, 240px); }
  .dbl { background: var(--pulse); color: #fff; font-weight: 800; padding: 4px 14px; border-radius: 999px; }
  .q-head { display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: start; }
  .q-text { font-size: clamp(36px, 3.5vw, 64px); line-height: 1.12; font-weight: 800; margin: 0; max-width: 32ch; }
  .reading .q-text { font-size: clamp(48px, 5vw, 92px); align-self: center; max-width: 24ch; }
  .reading .opening { font-size: 26px; color: var(--muted); margin-top: 26px; }
  .reading .opening b { color: var(--pulse); font-size: 40px; }
  .clock { text-align: right; }
  .secs { font-size: 96px; line-height: .9; font-weight: 900; font-stretch: 125%; font-variant-numeric: tabular-nums; }
  .secs.low { color: var(--pulse); }
  .ans { font-size: 20px; color: var(--muted); margin-top: 6px; }
  .ans b { color: var(--navy); font-size: 28px; font-variant-numeric: tabular-nums; }
  .fact { font-size: 26px; line-height: 1.35; max-width: 62ch; margin: 0; padding-left: 20px; border-left: 6px solid var(--pulse); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
  .tile { position: relative; overflow: hidden; display: flex; align-items: center; gap: 22px; padding: 20px 28px; border-radius: 18px; background: var(--c); color: var(--on); font-size: clamp(24px, 2.3vw, 40px); font-weight: 700; line-height: 1.15; min-height: 0; }
  .tile .shape { font-size: 1.3em; }
  .tile .fill { position: absolute; left: 0; bottom: 0; height: 10px; background: currentColor; opacity: .5; width: 0; transition: width .8s ease-out; }
  .tile .n { margin-left: auto; font-size: 1.2em; font-weight: 900; font-variant-numeric: tabular-nums; }
  .tiles.reveal .tile.wrong { background: #fff; color: #9AA4BC; box-shadow: inset 0 0 0 3px var(--line); }
  .tiles.reveal .tile.right { box-shadow: 0 0 0 6px var(--navy); animation: tile-pop .52s cubic-bezier(.3,.9,.3,1) .1s 2; }
  @keyframes tile-pop { 0%, 100% { transform: scale(1); } 45% { transform: scale(1.035); } }
  .tiles.reveal .tile.right .n::before { content: "✓ "; }

  /* watermark: the same artwork, large and faint, as a ground for busier screens */
  /* `position` stays on .watermark itself and the lift rule skips it, otherwise
     `.board > *` would win on equal specificity and drop it back into the flow. */
  .watermark { position: absolute; pointer-events: none; opacity: .06; color: var(--navy); z-index: 0; }
  .watermark .art { width: 100%; height: auto; }
  /* Not on the lobby: that screen is already full, and clipping it to hold a
     watermark cut off the join QR. */
  .board, .card.brk { position: relative; overflow: hidden; }
  .board > *:not(.watermark),
  .card.brk > *:not(.watermark) { position: relative; z-index: 1; }
  .board .watermark { right: -3%; bottom: 0; width: 44%; }
  .card.brk .watermark { right: 2%; top: 50%; transform: translateY(-50%); width: 36%; color: var(--pulse); opacity: .09; }

  /* boards */
  .board { height: 100%; display: flex; flex-direction: column; justify-content: center; max-width: 1100px; }
  .board h2 { font-size: 56px; font-weight: 900; font-stretch: 125%; margin: 0 0 22px; }
  .row { display: grid; grid-template-columns: 64px 64px 1fr auto; align-items: center; gap: 20px; padding: 12px 0; border-bottom: 2px solid var(--line); font-size: 36px; font-weight: 700; }
  .row .r { color: var(--muted); font-stretch: 125%; font-variant-numeric: tabular-nums; }
  .row .s { font-variant-numeric: tabular-nums; }
  /* final: three places, tallest in the middle, networking panel alongside */
  .final { height: 100%; display: grid; grid-template-columns: minmax(0, 2.1fr) minmax(300px, .9fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 18px 40px; }
  .final h2 { grid-column: 1 / -1; font-size: clamp(36px, 3.4vw, 56px); font-weight: 900; font-stretch: 125%; margin: 0; line-height: 1.02; }
  .final.no-net { grid-template-columns: minmax(0, 1fr); }
  /* Podium: a flex row so one, two or three winners all sit correctly, and the
     medal is in the flow rather than absolutely placed, so it can never clip. */
  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 20px; min-height: 0; }
  .win { flex: 1 1 0; max-width: 360px; min-width: 0; border-radius: 22px 22px 0 0; padding: 20px 18px 22px;
         display: flex; flex-direction: column; align-items: center; text-align: center; }
  .win .medal { width: 54px; height: 54px; margin-bottom: 8px; color: var(--pulse); }
  .win .avatar { width: clamp(72px, 13vh, 124px); height: auto; margin-bottom: 12px; box-shadow: 0 0 0 4px #fff, 0 0 0 6px rgba(27,42,78,.16); }
  .win .place { font-size: 15px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--pulse); }
  .win .name { font-size: clamp(20px, 2vw, 36px); line-height: 1.05; font-weight: 900; font-stretch: 112%; margin: 5px 0 3px; overflow-wrap: anywhere; }
  .win .pts { font-size: 18px; opacity: .75; font-variant-numeric: tabular-nums; }

  /* First place is taller, darker and wider. */
  .win.p1 { background: var(--navy); color: #fff; flex-grow: 1.3; padding-top: 30px; padding-bottom: 40px; }
  .win.p1 .medal { width: 66px; height: 66px; color: var(--a2); }
  .win.p1 .avatar { width: clamp(88px, 16vh, 152px); }
  .win.p1 .place { color: var(--a2); }
  .win.p1 .name { font-size: clamp(24px, 2.6vw, 46px); }
  .win.p2 { background: #fff; box-shadow: inset 0 0 0 3px var(--navy); }
  .win.p3 { background: #fff; box-shadow: inset 0 0 0 3px var(--line); }
  .win.p3 .medal { color: var(--muted); }
  .runners { grid-column: 1; display: flex; flex-wrap: wrap; gap: 10px 26px; font-size: 20px; color: var(--muted); align-items: center; }
  .runners span { display: inline-flex; gap: 9px; align-items: center; }
  .runners b { color: var(--navy); font-variant-numeric: tabular-nums; }

  /* networking panel + full-screen networking QR */
  .netcard { grid-row: 2 / 4; align-self: stretch; display: flex; flex-direction: column; justify-content: center; gap: 12px; background: #fff; border-radius: 24px; box-shadow: inset 0 0 0 3px var(--navy); padding: 24px; text-align: center; min-height: 0; }
  .netcard h3 { font-size: 26px; font-weight: 900; font-stretch: 112%; margin: 0; line-height: 1.05; }
  .netcard p { font-size: 17px; color: var(--muted); margin: 0; line-height: 1.35; }
  .netcard img { display: block; width: 100%; max-width: min(26vh, 260px); height: auto; margin: 0 auto; border-radius: 10px; }
  .netcard .u { font-size: 15px; font-weight: 700; color: var(--a1); word-break: break-all; }
  .netfull { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 56px; }
  .netfull h1 { font-size: clamp(52px, 6vw, 112px); line-height: .92; font-weight: 900; font-stretch: 125%; margin: 0 0 16px; letter-spacing: -.02em; }
  .netfull p { font-size: 28px; color: var(--muted); margin: 0 0 10px; max-width: 26ch; line-height: 1.3; }
  .netfull .u { font-size: 24px; font-weight: 700; color: var(--a1); word-break: break-all; }
  .netfull .qr img { width: min(62vh, 38vw); }

  /* winners list (menu panel) */
  .wins { position: fixed; right: 32px; bottom: 98px; width: min(460px, 92vw); max-height: 66vh; overflow: auto; overscroll-behavior: contain; background: #fff; border: 2px solid var(--navy); border-radius: 16px; padding: 16px; display: none; flex-direction: column; gap: 10px; z-index: 6; }
  .wins.open { display: flex; }
  .wins h3 { font-size: 20px; font-weight: 900; margin: 0; }
  .wins .sub { font-size: 14px; color: var(--muted); margin: -4px 0 2px; line-height: 1.4; }
  .wins ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .wins li { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700; padding: 5px 8px; border-radius: 10px; background: var(--paper); }
  .wins li .pl { font-size: 13px; font-weight: 800; color: var(--pulse); width: 26px; flex: none; font-variant-numeric: tabular-nums; }
  .wins li .nm2 { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wins li .sc { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .wins .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .wins .acts button { flex: 1; min-width: 120px; background: var(--navy); color: #fff; border: 0; border-radius: 10px; padding: 10px 12px; font-size: 15px; font-weight: 700; }
  .wins .acts button.warn { background: #fff; color: var(--a0); box-shadow: inset 0 0 0 2px var(--a0); }
  .wins .ep { font-size: 13px; color: var(--muted); word-break: break-all; }

  /* mentor links editor */
  .ment { position: fixed; right: 32px; bottom: 98px; width: min(620px, 94vw); max-height: 72vh; overflow: auto; overscroll-behavior: contain; background: #fff; border: 2px solid var(--navy); border-radius: 16px; padding: 16px; display: none; flex-direction: column; gap: 10px; z-index: 6; }
  .ment.open { display: flex; }
  .ment h3 { font-size: 20px; font-weight: 900; margin: 0; }
  .ment .sub { font-size: 14px; color: var(--muted); margin: -4px 0 0; line-height: 1.45; }
  .ment code { background: var(--paper); border-radius: 5px; padding: 1px 5px; font-size: 13px; }
  .ment textarea { width: 100%; min-height: 190px; font: inherit; font-size: 15px; line-height: 1.5; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--navy); color: var(--navy); background: #fff; resize: vertical; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
  .ment .acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ment .acts button { background: var(--navy); color: #fff; border: 0; border-radius: 10px; padding: 11px 18px; font-size: 15px; font-weight: 700; }
  .ment .acts .count { font-size: 14px; color: var(--muted); }
  .ment .issues { font-size: 14px; color: var(--a0); margin: 0; padding-left: 18px; line-height: 1.5; }
  .ment .good { font-size: 14px; color: var(--a3); font-weight: 700; margin: 0; }

  /* controls */
  .controls { position: fixed; right: 32px; bottom: 26px; display: flex; gap: 12px; align-items: center; }
  .next { background: var(--navy); color: #fff; border: 0; border-radius: 999px; padding: 18px 36px; font-size: 24px; font-weight: 800; }
  .next:disabled { opacity: .5; cursor: default; }
  .gear { background: #fff; border: 2px solid var(--navy); color: var(--navy); border-radius: 999px; padding: 14px 20px; font-size: 18px; font-weight: 700; }
  .menu { position: fixed; right: 32px; bottom: 98px; background: #fff; border: 2px solid var(--navy); border-radius: 16px; padding: 8px; display: none; flex-direction: column; min-width: 280px; z-index: 4; }

  /* every panel gets a title row with a close button, and Esc closes it too */
  .phead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .phead h3 { margin: 0; }
  .pclose { flex: none; width: 34px; height: 34px; border: 2px solid var(--line); background: #fff; color: var(--navy); border-radius: 50%; font-size: 19px; font-weight: 800; line-height: 1; display: grid; place-items: center; padding: 0; }
  .pclose:hover { background: var(--navy); border-color: var(--navy); color: #fff; }
  .menu .phint { font-size: 13px; color: var(--muted); padding: 2px 14px 6px; }
  .menu .pclose { margin: 2px 6px 4px auto; }
  .menu.open { display: flex; }
  .menu button { background: none; border: 0; text-align: left; padding: 12px 14px; border-radius: 10px; font-size: 18px; color: var(--navy); }
  .menu button:hover { background: var(--paper); }
  .hint { font-size: 15px; color: var(--muted); padding: 8px 14px 4px; line-height: 1.4; }
  .gate { position: fixed; inset: 0; background: var(--navy); color: #fff; display: grid; place-items: center; z-index: 10; }
  .gate form { width: min(420px, 90vw); }
  .gate h1 { font-size: 48px; font-stretch: 125%; font-weight: 900; margin: 0 0 8px; }
  .gate p { margin: 0 0 24px; font-size: 18px; opacity: .8; }
  .gate input { width: 100%; font: inherit; font-size: 24px; padding: 14px 18px; border-radius: 12px; border: 0; margin-bottom: 12px; }
  .gate button { width: 100%; font-size: 22px; font-weight: 800; padding: 14px; border: 0; border-radius: 12px; background: var(--pulse); color: #fff; }
  .gate .err { color: #FFB3C1; min-height: 1.4em; font-size: 18px; }
  .banner { position: fixed; top: 0; left: 0; right: 0; background: var(--a2); color: var(--navy-deep); text-align: center; padding: 8px; font-weight: 700; display: none; z-index: 5; }
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<div class="gate" id="gate">
  <form id="gateForm">
    <h1>Host screen</h1>
    <p>Enter the host PIN to run the game.</p>
    <input id="pin" type="password" autocomplete="current-password" placeholder="Host PIN" aria-label="Host PIN" required>
    <div class="err" id="gateErr"></div>
    <button type="submit">Open host screen</button>
  </form>
</div>

<div class="stage">
  <div class="bar"><span class="event">Omni Pulse Tech 2026</span><span id="stats"></span></div>
  <div class="pulse-row" id="pulse"></div>
  <main id="main"></main>
</div>

<div class="menu" id="menu">
  <button id="winBtn">Winners list</button>
  <button id="mentBtn">Mentor links</button>
  <button id="netBtn">Networking QR (N)</button>
  <button id="newBtn">Set up a new game</button>
  <button id="freshBtn">Mark all questions unused</button>
  <button id="fsBtn">Full screen (F)</button>
  <button class="pclose" id="menuClose" aria-label="Close menu" title="Close (Esc)">&times;</button>
  <div class="hint">Space or → moves on. Questions reveal on their own when time runs out or everyone answers. Click a player in the lobby to remove them.</div>
</div>
<div class="wins" id="wins"></div>
<div class="ment" id="ment"></div>
<div class="controls">
  <button class="gear" id="gear" aria-expanded="false">Menu</button>
  <button class="next" id="next">Start game</button>
</div>

<script src="/avatar.js"></script>
<script src="/art.js"></script>
<script src="/common.js"></script>
<script>
const $main = document.getElementById('main');
const $pulse = document.getElementById('pulse');
const $stats = document.getElementById('stats');
const $next = document.getElementById('next');
const $banner = document.getElementById('banner');
$pulse.innerHTML = ecgSvg();

let pin = sessionStorage.getItem('pc_pin') || '';
let st = null, setupMode = false, netMode = false, lastKey = '', joinUrl = '';
let setup = { categories: null, total: null, chunk: null, breaks: true, final: true };
const seen = new Set();
const timers = new Set();
const clearTimers = () => { timers.forEach(f => f()); timers.clear(); };
const hostApi = (method = 'GET', body) => api('host', { method, body, headers: { 'x-host-pin': pin } });

// ---------- auth + polling ----------
document.getElementById('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  pin = document.getElementById('pin').value;
  try { await hostApi(); sessionStorage.setItem('pc_pin', pin); start(); }
  catch (err) { document.getElementById('gateErr').textContent = err.status === 401 ? 'That PIN doesn’t match HOST_PIN on the server.' : err.message; }
});

let started = false;
async function start() {
  if (started) return;
  started = true;
  document.getElementById('gate').style.display = 'none';
  await Clock.sync();
  setInterval(() => Clock.sync(), 60000);
  fetch('/api/qr').then(r => { joinUrl = r.headers.get('X-Join-Url') || location.origin + '/'; if (st && st.phase === 'lobby') render(true); });
  startPolling(() => hostApi(), s => { st = s; render(); }, {
    interval: 1000,
    onError: (e, n) => {
      if (e && e.status === 401) { sessionStorage.removeItem('pc_pin'); location.reload(); }
      $banner.style.display = e && n > 1 ? 'block' : 'none';
      if (e) $banner.textContent = e.status === 503 ? 'The database isn’t configured. Set DATABASE_URL in Vercel.' : 'Can’t reach the game server. Retrying…';
    }
  });
}
if (pin) hostApi().then(start, () => { sessionStorage.removeItem('pc_pin'); });

// ---------- controls ----------
let busy = false;
async function goNext() {
  if (busy || !st || setupMode || netMode || st.phase === 'none' || st.phase === 'final') return;
  busy = true; $next.disabled = true;
  try { await hostApi('POST', { action: 'next', v: st.v }); st = await hostApi(); render(); }
  catch (e) { flash(e.message); }
  finally { busy = false; $next.disabled = false; }
}
$next.addEventListener('click', () => { if (setupMode || !st || st.phase === 'none' || st.phase === 'final') return openSetup(); goNext(); });
document.addEventListener('keydown', e => {
  // Never steal keys from a field: Space would advance the game and N would flip
  // to the networking screen while the host is typing mentor links.
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); if (!setupMode && !netMode) goNext(); }
  if (e.key === 'f' || e.key === 'F') toggleFs();
  if (e.key === 'n' || e.key === 'N') toggleNet();
});
const $menu = document.getElementById('menu'), $gear = document.getElementById('gear');
const $wins = document.getElementById('wins');
const $ment = document.getElementById('ment');

// One owner for every overlay, so there is always a way back out: the close
// button in each panel, Esc, clicking the page behind it, or the Menu button.
function closeOverlays(except) {
  for (const el of [$menu, $wins, $ment]) if (el && el !== except) el.classList.remove('open');
  $gear.setAttribute('aria-expanded', $menu.classList.contains('open'));
}
function toggleOverlay(el, onOpen) {
  const opening = !el.classList.contains('open');
  closeOverlays(opening ? el : null);
  el.classList.toggle('open', opening);
  $gear.setAttribute('aria-expanded', $menu.classList.contains('open'));
  if (opening && onOpen) onOpen();
  return opening;
}
$gear.onclick = () => toggleOverlay($menu);
document.getElementById('menuClose').onclick = () => closeOverlays();
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($menu.classList.contains('open') || $wins.classList.contains('open') || $ment.classList.contains('open')) {
    e.preventDefault();
    closeOverlays();
  }
});
// Clicking the page behind an overlay dismisses it. pointerdown rather than
// click so it still works when the press starts on the projector screen.
document.addEventListener('pointerdown', e => {
  const t = e.target;
  if (!t || typeof t.closest !== 'function') return;
  if (t.closest('.menu, .wins, .ment, .controls')) return;
  closeOverlays();
});
function toggleFs() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
document.getElementById('fsBtn').onclick = () => { toggleFs(); closeOverlays(); };

  }

function toggleNet() {

    <textarea id="mentText" spellcheck="false" placeholder="Asha Patel | Cloud Architect at TCS | https://linkedin.com/in/example
Ravi Singh | Security Lead | https://linkedin.com/in/example2"></textarea>
    <div class="acts"><button id="mentSave">Save links</button>

document.getElementById('newBtn').onclick = () => {
  closeOverlays();

  const msg = unfinished
    ? 'Set up a new game? This game has not reached the final screen, so its top ' + places() + ' will NOT be saved to the winners list. Scores reset. Player profiles stay.'
    : 'Set up a new game? The current game ends and scores reset. Player profiles stay.';

$main.addEventListener('click', async e => {
  const p = e.target.closest('.p[data-id]');
  if (p && confirm(`Remove “${p.dataset.name}” from the game? Their profile is deleted.`)) {

function flash(msg) { $banner.textContent = msg; $banner.style.display = 'block'; setTimeout(() => { $banner.style.display = 'none'; }, 4000); }

// ---------- render ----------
const LABEL = { lobby: 'Start game', slide: 'Next', question: 'Show answer', reveal: 'Next', leaderboard: 'Next', final: 'New game', none: 'Set up game' };

function render(force) {
  if (!st) return;
  if (st.phase === 'none' && !setupMode) setupMode = true;
  const s = st.slide;
  $stats.innerHTML = s && s.type === 'q' ? `Question <b>${s.num}</b> of ${s.total} &nbsp;&nbsp; <b>${st.players}</b> playing` : `<b>${st.players || 0}</b> playing`;
  $next.textContent = setupMode ? 'Create game' : LABEL[st.phase];
  $next.style.display = setupMode || netMode ? 'none' : '';

  const key = netMode ? 'net' : setupMode ? 'setup' : `${st.phase}:${st.id}:${st.idx}:${st.v}`;
  if (key === lastKey && !force) return patch();
  lastKey = key;
  clearTimers();
  ecgIdle($pulse);
  if (netMode) return netView();
  if (setupMode) return setupView();
  switch (st.phase) {
    case 'lobby': return lobbyView();
    case 'slide': return s.type === 'round' ? roundView(s) : breakView(s);
    case 'question': return questionView(s, false);
    case 'reveal': return questionView(s, true);
    case 'leaderboard': return boardView();
    case 'final': return finalView();
  }
}

function patch() {
  paintWinners();
  if (setupMode || netMode) return;
  if (st.phase === 'lobby') return paintWall();
  if (st.phase === 'question') {
    const a = document.getElementById('answered');
    if (a) a.textContent = st.answered || 0;
    maybeAutoReveal();
  }
}

// ---------- setup ----------
function openSetup() { setupMode = true; render(true); }

// Everything the setup screen derives from the current choices. Kept separate so
// a click can update the numbers in place: rebuilding $main would reset .setup's
// scroll position to the top and throw the host back up the page on every press.
function setupFacts() {
  const bank = st.bank || [];
  const R = st.ranges || { total: { min: 4, max: 60, def: 24 }, chunk: { min: 3, max: 10, def: 6 } };
  const supply = setup.categories.reduce((n, id) => {
    const b = bank.find(x => x.id === id);
    return n + (b ? b.total : 0);
  }, 0);
  const ceiling = supply ? Math.min(R.total.max, Math.max(R.total.min, supply)) : R.total.max;
  // Only pull the count down to what the bank holds while a category is actually
  // selected, so deselecting everything doesn't silently reset the host's number.
  if (supply) setup.total = Math.min(Math.max(setup.total, R.total.min), ceiling);
  const drawn = Math.min(setup.total, supply);
  const asked = drawn + (setup.final && supply > drawn ? 1 : 0);
  const stops = Math.max(1, Math.ceil(drawn / setup.chunk));
  return { bank, R, supply, ceiling, drawn, asked, stops, mins: Math.round(asked * 0.75 + stops * 0.5 + 4) };
}

function syncSetup() {
  const f = setupFacts();
  const set = (id, value, lo, hi, hint) => {
    const box = document.getElementById(id);
    if (!box) return;
    const input = box.querySelector('input');
    if (input && document.activeElement !== input) input.value = value;
    if (input) { input.min = lo; input.max = hi; }
    box.querySelector('[data-d="-1"]').disabled = value <= lo;
    box.querySelector('[data-d="1"]').disabled = value >= hi;
    const small = box.parentElement.querySelector('small');
    if (small) small.textContent = hint;
  };
  set('total', setup.total, f.R.total.min, f.ceiling, f.supply ? `${f.supply} available` : 'pick a category');
  set('chunk', setup.chunk, f.R.chunk.min, f.R.chunk.max, `${f.stops} ${f.stops === 1 ? 'stop' : 'stops'}`);
  $main.querySelectorAll('.cat').forEach(b => b.setAttribute('aria-pressed', setup.categories.includes(b.dataset.id)));
  const create = document.getElementById('create');
  if (create) create.disabled = !setup.categories.length;
  const sum = $main.querySelector('.summary');
  if (sum) {
    sum.innerHTML = `${f.asked} questions from ${setup.categories.length} ${setup.categories.length === 1 ? 'category' : 'categories'}, about ${f.mins} minutes`
      + (f.drawn < setup.total ? ` &middot; the bank only has ${f.supply}, so ${f.drawn} will be asked` : '');
  }
}

function setupView() {
  const R = st.ranges || { total: { min: 4, max: 60, def: 24 }, chunk: { min: 3, max: 10, def: 6 } };
  // Defaults come from DEFAULT_CATEGORIES on the server, so the two can't drift.
  if (!setup.categories) setup.categories = (st.defaultCategories || []).filter(id => (st.bank || []).find(b => b.id === id && b.total));
  if (setup.total == null) setup.total = R.total.def;
  if (setup.chunk == null) setup.chunk = R.chunk.def;
  const f = setupFacts();

  // The value is a real input, so the host can type 24 instead of pressing + 20 times.
  const stepper = (id, value, lo, hi) => `<span class="step" id="${id}">
    <button type="button" data-d="-1" aria-label="fewer">&minus;</button>
    <input type="number" inputmode="numeric" value="${value}" min="${lo}" max="${hi}" aria-label="${id === 'total' ? 'Number of questions' : 'Questions between leaderboards'}">
    <button type="button" data-d="1" aria-label="more">+</button></span>`;

  $main.innerHTML = `<section class="setup">
    <h1>Set up the game</h1>
    <p class="lede">Questions are drawn at random across the categories you pick, evenly and least-used first, with answer order shuffled every game.</p>
    <div class="cats">${f.bank.map(b => `<button class="cat" data-id="${b.id}" aria-pressed="${setup.categories.includes(b.id)}" ${b.total ? '' : 'disabled'}>
      <span class="t">${esc(b.title)}</span><span class="b">${esc(b.blurb)}</span><span class="n">${b.total} questions, ${b.fresh} not used yet</span></button>`).join('')}</div>
    <div class="opts-row">
      <span class="ctl">Questions ${stepper('total', setup.total, R.total.min, f.ceiling)} <small></small></span>
      <span class="ctl">Leaderboard every ${stepper('chunk', setup.chunk, R.chunk.min, R.chunk.max)} <small></small></span>
      <label class="toggle"><input type="checkbox" id="breaks" ${setup.breaks ? 'checked' : ''}> Networking breaks</label>
      <label class="toggle"><input type="checkbox" id="final" ${setup.final ? 'checked' : ''}> Double-points final</label>
    </div>
    <button class="create" id="create">Create game</button>
    <span class="summary"></span>
  </section>`;

  $main.querySelectorAll('.cat').forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    setup.categories = setup.categories.includes(id) ? setup.categories.filter(c => c !== id) : [...setup.categories, id];
    syncSetup();
  });

  const bind = (id, lo, hiOf) => {
    const box = document.getElementById(id);
    box.querySelectorAll('button').forEach(b => b.onclick = () => {
      setup[id] = Math.min(hiOf(), Math.max(lo, setup[id] + Number(b.dataset.d)));
      syncSetup();
    });
    const input = box.querySelector('input');
    input.oninput = () => {
      const v = parseInt(input.value, 10);
      if (Number.isFinite(v)) { setup[id] = Math.min(hiOf(), Math.max(lo, v)); syncSetup(); }
    };
    // Snap the field back to the clamped value once the host is done typing.
    input.onblur = () => { input.value = setup[id]; syncSetup(); };
    input.onkeydown = e => { if (e.key === 'Enter') input.blur(); };
  };
  bind('total', R.total.min, () => setupFacts().ceiling);
  bind('chunk', R.chunk.min, () => R.chunk.max);

  document.getElementById('breaks').onchange = e => { setup.breaks = e.target.checked; syncSetup(); };
  document.getElementById('final').onchange = e => { setup.final = e.target.checked; syncSetup(); };
  document.getElementById('create').onclick = async e => {
    e.target.disabled = true;
    try {
      await hostApi('POST', { action: 'new', settings: setup });
      setupMode = false; seen.clear();
      st = await hostApi(); render(true);
    } catch (err) { flash(err.message); e.target.disabled = false; }
  };
  syncSetup();
}

function lobbyView() {
  $main.innerHTML = `<section class="lobby">
    <div class="watermark">${categoryArt('', { width: 420 })}</div>
    <div class="join">
      <h1 class="title">Pulse<br>Check</h1>
      <p class="lede2">Scan to make your player and join. No app, no sign-up.</p>

function paintWall() {
  const grid = document.getElementById('grid');
  if (!grid) return;
  const list = st.roster || [];
  document.getElementById('count').innerHTML = `<b>${st.players}</b>${st.players === 1 ? 'player is' : 'players are'} in`;
  if (!list.length) { grid.innerHTML = '<p class="empty">Players appear here as they join.</p>'; return; }
  // clientWidth/Height are 0 until the grid has been laid out, so fall back to the
  // viewport rather than collapsing the wall to the minimum.
  const gw = grid.clientWidth || Math.round(window.innerWidth * 0.5);
  const gh = grid.clientHeight || Math.round(window.innerHeight * 0.62);
  const fit = Math.max(12, Math.floor((gw + 10) / 114) * Math.floor((gh + 14) / 136));
  const shown = list.slice(0, st.players > fit ? fit - 1 : fit);
  grid.innerHTML = shown.map(p => {
    const fresh = !seen.has(p.id);
    return `<button class="p${fresh ? ' new' : ''}" data-id="${esc(p.id)}" data-name="${esc(p.name)}" title="Remove ${esc(p.name)}">${avatarSvg(p.avatar, { size: 84 })}<span class="nm">${esc(p.name)}</span></button>`;
  }).join('');
  list.forEach(p => seen.add(p.id));
  if (st.players > shown.length) grid.insertAdjacentHTML('beforeend', `<span class="p"><span class="nm" style="font-size:20px;margin-top:30px">+${st.players - shown.length} more</span></span>`);
}

// ---------- question ----------
let autoFired = null;
function maybeAutoReveal() {
  // Don't auto-advance behind the networking screen, and don't burn the
  // one-shot guard while we're there either.
  if (!st || netMode || st.phase !== 'question' || autoFired === st.v) return;
  const allIn = st.players > 0 && (st.answered || 0) >= st.players && Clock.now() >= st.openAt;
  if (allIn || Clock.now() >= st.endsAt + 1200) { autoFired = st.v; goNext(); }
}

function tilesHtml(s, reveal) {
  const total = reveal ? st.reveal.counts.reduce((a, b) => a + b, 0) : 0;
  return s.options.map((o, i) => {
    const cls = reveal ? (i === st.reveal.answer ? 'right' : 'wrong') : '';
    const n = reveal ? st.reveal.counts[i] : '';
    const pct = reveal && total ? Math.round(st.reveal.counts[i] / total * 100) : 0;
    return `<div class="tile c${i} ${cls}" aria-label="${SHAPE_NAMES[i]}: ${esc(o)}">${SHAPES[i]}<span>${esc(o)}</span>${reveal ? `<span class="n">${n}</span><span class="fill" data-w="${pct}"></span>` : ''}</div>`;
  }).join('');
}

function questionView(s, reveal) {
  const meta = `<div class="q-meta">${categoryArt(s.cat, { width: 180, draw: false })}<span class="ct">${esc(s.catTitle || '')}</span>${s.double ? '<span class="dbl">Double points</span>' : ''}</div>`;
  if (!reveal && Clock.now() < st.openAt) {
    $main.innerHTML = `<section class="q reading">${meta}<div><h2 class="q-text">${esc(s.text)}</h2><p class="opening">Answers open in <b id="open"></b></p></div></section>`;
    const el = document.getElementById('open');
    timers.add(ecgCountdown($pulse, st.openAt, 3500, sec => { el.textContent = sec; }));
    timers.add(atServerTime(st.openAt, () => render(true)));
    return;
  }
  $main.innerHTML = `<section class="q">${meta}
    <div class="q-head"><h2 class="q-text">${esc(s.text)}</h2>
      ${reveal ? '' : `<div class="clock"><div class="secs" id="secs">${s.time}</div><div class="ans"><b id="answered">${st.answered || 0}</b> of ${st.players} answered</div></div>`}</div>
    <div style="display:grid;grid-template-rows:${reveal && st.reveal.fact ? 'auto 1fr' : '1fr'};gap:20px;min-height:0">
      ${reveal && st.reveal.fact ? `<p class="fact">${esc(st.reveal.fact)}</p>` : ''}
      <div class="tiles ${reveal ? 'reveal' : ''}" style="grid-template-rows:repeat(${Math.ceil(s.options.length / 2)},1fr)">${tilesHtml(s, reveal)}</div>
    </div></section>`;
  if (reveal) {
    requestAnimationFrame(() => requestAnimationFrame(() => $main.querySelectorAll('.fill').forEach(f => { f.style.width = f.dataset.w + '%'; })));
  } else {
    const secs = document.getElementById('secs');
    timers.add(ecgCountdown($pulse, st.endsAt, s.time * 1000, sec => { secs.textContent = sec; secs.classList.toggle('low', sec <= 5); }));
    const iv = setInterval(maybeAutoReveal, 250);
    timers.add(() => clearInterval(iv));
  }
}

// ---------- boards ----------
function boardView() {
  const t = st.top || [];
  // st.slide at this point is the question just revealed, so the ground picks up
  // whichever category the round ended on.
  const mark = `<div class="watermark">${categoryArt(st.slide && st.slide.cat, { width: 460 })}</div>`;
  $main.innerHTML = `<section class="board">${mark}<h2>Top ${t.length || 5} so far</h2>${t.map((p, i) =>
    `<div class="row"><span class="r">${i + 1}</span>${avatarSvg(p.avatar, { size: 60 })}<span>${esc(p.name)}</span><span class="s">${p.score.toLocaleString()}</span></div>`).join('') || '<p class="empty">No players yet.</p>'}</section>`;
}

const PLACE_LABEL = ['1st place', '2nd place', '3rd place', '4th place', '5th place'];

function finalView() {
  const t = st.top || [];
  if (!t.length) { $main.innerHTML = '<section class="board"><h2>Game over</h2><p class="empty">No one played this time.</p></section>'; return; }
  const n = places();
  const winners = t.slice(0, n);
  // Three winners stand 2 - 1 - 3 so first place is in the middle. Fewer than
  // three just read left to right, with no empty slots to leave a gap.
  const order = winners.length >= 3 ? [1, 0, 2] : winners.map((_, i) => i);
  const delays = { 0: 0, 1: 120, 2: 240 };
  const cards = order.map(i => {
    const p = winners[i];
    if (!p) return '';
    return `<div class="win p${i + 1} rise" style="animation-delay:${delays[i] || 0}ms">
      ${medalArt(i + 1, i === 0 ? 66 : 54)}
      ${avatarSvg(p.avatar, { size: 152, label: p.name })}
      <div class="place">${PLACE_LABEL[i] || `${i + 1}th place`}</div>
      <div class="name">${esc(p.name)}</div>
      <div class="pts">${p.score.toLocaleString()} points</div></div>`;
  }).join('');

  const rest = t.slice(winners.length).map((p, i) => `<span><b>${winners.length + i + 1}.</b>${avatarSvg(p.avatar, { size: 36 })}${esc(p.name)} (${p.score.toLocaleString()})</span>`).join('');
  const netT = netTarget();
  const net = netT ? `<aside class="netcard fade-up" style="animation-delay:700ms">
      <h3>Keep the night going</h3>
      <p>Scan to open ${netT.count ? `all ${netT.count} mentors'` : "the mentors'"} LinkedIn.</p>
      <img src="${esc(netT.qr)}" alt="QR code for the mentor links">
      <div class="u">${esc(netT.url)}</div>
    </aside>` : '';
  const heading = winners.length === 1 ? 'Our winner. Come up and claim your prize.'
    : `Our top ${winners.length}. Come up and claim your prize.`;
  $main.innerHTML = `<section class="final${netT ? '' : ' no-net'}">
    <h2>${heading}</h2>
    <div class="podium">${cards}</div>
    ${net}
    ${rest ? `<div class="runners fade-up" style="animation-delay:520ms">${rest}</div>` : ''}</section>`;
}
</script>
</body>
</html>
