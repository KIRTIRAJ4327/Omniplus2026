<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Check host screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { overflow: hidden; }
  .stage { height: 100vh; display: grid; grid-template-rows: auto 64px 1fr; }
  .bar { display: flex; justify-content: space-between; align-items: baseline; padding: 20px 48px 0; font-size: 20px; color: var(--muted); }
  .bar .event { font-weight: 800; font-stretch: 112%; color: var(--navy); }
  .bar b { color: var(--navy); font-variant-numeric: tabular-nums; }
  .pulse-row { padding: 6px 0; color: var(--navy); }
  main { min-height: 0; padding: 8px 48px 104px; }

  /* setup */
  .setup { height: 100%; overflow: auto; max-width: 1200px; }
  .setup h1 { font-size: 64px; font-weight: 900; font-stretch: 125%; margin: 0 0 8px; line-height: .95; }
  .setup .lede { font-size: 22px; color: var(--muted); margin: 0 0 28px; }
  .cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .cat { text-align: left; background: #fff; border: 3px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 6px; }
  .cat[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy); }
  .cat .t { font-size: 22px; font-weight: 800; }
  .cat .b { font-size: 16px; color: var(--muted); }
  .cat .n { font-size: 15px; color: var(--muted); margin-top: 6px; }
  .cat[aria-pressed="true"] .n::before { content: "✓ In the game · "; color: var(--a3); font-weight: 700; }
  .opts-row { display: flex; flex-wrap: wrap; gap: 28px; align-items: center; margin: 28px 0; font-size: 20px; }
  .seg { display: inline-flex; border: 2px solid var(--navy); border-radius: 999px; overflow: hidden; margin-left: 10px; }
  .seg button { background: #fff; border: 0; padding: 8px 16px; font-weight: 700; }
  .seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
  .toggle { display: inline-flex; align-items: center; gap: 10px; font-size: 20px; }
  .toggle input { width: 22px; height: 22px; accent-color: var(--navy); }
  .create { background: var(--pulse); color: #fff; border: 0; border-radius: 999px; padding: 18px 40px; font-size: 24px; font-weight: 800; }
  .create:disabled { opacity: .5; }
  .summary { font-size: 18px; color: var(--muted); margin-left: 16px; }

  /* lobby */
  .lobby { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 48px; }
  .join { display: flex; flex-direction: column; justify-content: center; }
  .title { font-size: clamp(56px, 7vw, 128px); line-height: .88; font-weight: 900; font-stretch: 125%; margin: 0 0 18px; letter-spacing: -.02em; }
  .lede2 { font-size: 26px; line-height: 1.3; margin: 0 0 18px; max-width: 24ch; }
  .qr { background: #fff; padding: 16px; border-radius: 24px; box-shadow: 0 0 0 3px var(--navy); align-self: flex-start; }
  .qr img { display: block; width: min(34vh, 24vw); height: auto; }
  .url { font-size: 22px; font-weight: 700; color: var(--a1); margin-top: 14px; word-break: break-all; }
  .wall { display: flex; flex-direction: column; min-height: 0; }
  .count { font-size: 24px; margin: 6px 0 14px; }
  .count b { font-size: 56px; font-stretch: 125%; margin-right: 8px; }
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 10px; align-content: start; overflow: hidden; }
  .p { display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0; color: var(--navy); }
  .p .nm { font-size: 15px; font-weight: 700; max-width: 104px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .p:hover .nm { color: var(--a0); text-decoration: line-through; }
  .p.new .avatar { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.3); } to { transform: scale(1); } }
  .empty { font-size: 26px; color: var(--muted); }

  /* cards */
  .card { height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .card .sub { font-size: 30px; color: var(--muted); margin: 0 0 12px; }
  .card h1 { font-size: clamp(64px, 9vw, 170px); line-height: .9; font-weight: 900; font-stretch: 125%; margin: 0 0 22px; letter-spacing: -.02em; max-width: 14ch; }
  .card p { font-size: 34px; margin: 0; color: var(--muted); max-width: 32ch; line-height: 1.3; }
  .card.brk p { color: var(--navy); font-size: 46px; font-weight: 600; max-width: 26ch; }
  .big-secs { font-size: 120px; font-weight: 900; font-stretch: 125%; color: var(--pulse); margin-top: 28px; font-variant-numeric: tabular-nums; }

  /* question */
  .q { height: 100%; display: grid; grid-template-rows: auto auto 1fr; gap: 22px; }
  .q.reading { grid-template-rows: auto 1fr; }
  .q-meta { display: flex; gap: 18px; align-items: baseline; font-size: 22px; color: var(--muted); }
  .dbl { background: var(--pulse); color: #fff; font-weight: 800; padding: 4px 14px; border-radius: 999px; }
  .q-head { display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: start; }
  .q-text { font-size: clamp(36px, 3.5vw, 64px); line-height: 1.12; font-weight: 800; margin: 0; max-width: 32ch; }
  .reading .q-text { font-size: clamp(48px, 5vw, 92px); align-self: center; max-width: 24ch; }
  .reading .opening { font-size: 26px; color: var(--muted); margin-top: 26px; }
  .reading .opening b { color: var(--pulse); font-size: 40px; }
  .clock { text-align: right; }
  .secs { font-size: 96px; line-height: .9; font-weight: 900; font-stretch: 125%; font-variant-numeric: tabular-nums; }
  .secs.low { color: var(--pulse); }
  .ans { font-size: 20px; color: var(--muted); margin-top: 6px; }
  .ans b { color: var(--navy); font-size: 28px; font-variant-numeric: tabular-nums; }
  .fact { font-size: 26px; line-height: 1.35; max-width: 62ch; margin: 0; padding-left: 20px; border-left: 6px solid var(--pulse); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
  .tile { position: relative; overflow: hidden; display: flex; align-items: center; gap: 22px; padding: 20px 28px; border-radius: 18px; background: var(--c); color: var(--on); font-size: clamp(24px, 2.3vw, 40px); font-weight: 700; line-height: 1.15; min-height: 0; }
  .tile .shape { font-size: 1.3em; }
  .tile .fill { position: absolute; left: 0; bottom: 0; height: 10px; background: currentColor; opacity: .5; width: 0; transition: width .8s ease-out; }
  .tile .n { margin-left: auto; font-size: 1.2em; font-weight: 900; font-variant-numeric: tabular-nums; }
  .tiles.reveal .tile.wrong { background: #fff; color: #9AA4BC; box-shadow: inset 0 0 0 3px var(--line); }
  .tiles.reveal .tile.right { box-shadow: 0 0 0 6px var(--navy); }
  .tiles.reveal .tile.right .n::before { content: "✓ "; }

  /* boards */
  .board { height: 100%; display: flex; flex-direction: column; justify-content: center; max-width: 1100px; }
  .board h2 { font-size: 56px; font-weight: 900; font-stretch: 125%; margin: 0 0 22px; }
  .row { display: grid; grid-template-columns: 64px 64px 1fr auto; align-items: center; gap: 20px; padding: 12px 0; border-bottom: 2px solid var(--line); font-size: 36px; font-weight: 700; }
  .row .r { color: var(--muted); font-stretch: 125%; font-variant-numeric: tabular-nums; }
  .row .s { font-variant-numeric: tabular-nums; }
  .final { height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr auto; gap: 22px 32px; }
  .final h2 { grid-column: 1 / -1; font-size: 60px; font-weight: 900; font-stretch: 125%; margin: 0; line-height: 1; }
  .win { border-radius: 28px; padding: 32px; display: flex; flex-direction: column; justify-content: flex-end; min-height: 0; position: relative; }
  .win .avatar { width: min(26vh, 220px); height: auto; margin-bottom: 18px; box-shadow: 0 0 0 6px #fff; }
  .win.first { background: var(--navy); color: #fff; }
  .win.second { background: #fff; box-shadow: inset 0 0 0 4px var(--navy); }
  .win .place { font-size: 30px; font-weight: 800; color: var(--pulse); }
  .win .name { font-size: clamp(44px, 5vw, 92px); line-height: 1; font-weight: 900; font-stretch: 112%; margin: 6px 0; overflow-wrap: anywhere; }
  .win .pts { font-size: 28px; opacity: .8; font-variant-numeric: tabular-nums; }
  .runners { grid-column: 1 / -1; display: flex; gap: 32px; font-size: 24px; color: var(--muted); align-items: center; }
  .runners span { display: inline-flex; gap: 10px; align-items: center; }
  .runners b { color: var(--navy); }

  /* controls */
  .controls { position: fixed; right: 32px; bottom: 26px; display: flex; gap: 12px; align-items: center; }
  .next { background: var(--navy); color: #fff; border: 0; border-radius: 999px; padding: 18px 36px; font-size: 24px; font-weight: 800; }
  .next:disabled { opacity: .5; cursor: default; }
  .gear { background: #fff; border: 2px solid var(--navy); color: var(--navy); border-radius: 999px; padding: 14px 20px; font-size: 18px; font-weight: 700; }
  .menu { position: fixed; right: 32px; bottom: 98px; background: #fff; border: 2px solid var(--navy); border-radius: 16px; padding: 8px; display: none; flex-direction: column; min-width: 280px; z-index: 4; }
  .menu.open { display: flex; }
  .menu button { background: none; border: 0; text-align: left; padding: 12px 14px; border-radius: 10px; font-size: 18px; color: var(--navy); }
  .menu button:hover { background: var(--paper); }
  .hint { font-size: 15px; color: var(--muted); padding: 8px 14px 4px; line-height: 1.4; }
  .gate { position: fixed; inset: 0; background: var(--navy); color: #fff; display: grid; place-items: center; z-index: 10; }
  .gate form { width: min(420px, 90vw); }
  .gate h1 { font-size: 48px; font-stretch: 125%; font-weight: 900; margin: 0 0 8px; }
  .gate p { margin: 0 0 24px; font-size: 18px; opacity: .8; }
  .gate input { width: 100%; font: inherit; font-size: 24px; padding: 14px 18px; border-radius: 12px; border: 0; margin-bottom: 12px; }
  .gate button { width: 100%; font-size: 22px; font-weight: 800; padding: 14px; border: 0; border-radius: 12px; background: var(--pulse); color: #fff; }
  .gate .err { color: #FFB3C1; min-height: 1.4em; font-size: 18px; }
  .banner { position: fixed; top: 0; left: 0; right: 0; background: var(--a2); color: var(--navy-deep); text-align: center; padding: 8px; font-weight: 700; display: none; z-index: 5; }
</style>
</head>
<body>
<div class="banner" id="banner"></div>
<div class="gate" id="gate">
  <form id="gateForm">
    <h1>Host screen</h1>
    <p>Enter the host PIN to run the game.</p>
    <input id="pin" type="password" autocomplete="current-password" placeholder="Host PIN" aria-label="Host PIN" required>
    <div class="err" id="gateErr"></div>
    <button type="submit">Open host screen</button>
  </form>
</div>

<div class="stage">
  <div class="bar"><span class="event">Omni Pulse Tech 2026</span><span id="stats"></span></div>
  <div class="pulse-row" id="pulse"></div>
  <main id="main"></main>
</div>

<div class="menu" id="menu">
  <button id="newBtn">Set up a new game</button>
  <button id="fsBtn">Full screen (F)</button>
  <div class="hint">Space or → moves on. Questions reveal on their own when time runs out or everyone answers. Click a player in the lobby to remove them.</div>
</div>
<div class="controls">
  <button class="gear" id="gear" aria-expanded="false">Menu</button>
  <button class="next" id="next">Start game</button>
</div>

<script src="/avatar.js"></script>
<script src="/common.js"></script>
<script>
const $main = document.getElementById('main');
const $pulse = document.getElementById('pulse');
const $stats = document.getElementById('stats');
const $next = document.getElementById('next');
const $banner = document.getElementById('banner');
$pulse.innerHTML = ecgSvg();

let pin = sessionStorage.getItem('pc_pin') || '';
let st = null, setupMode = false, lastKey = '', joinUrl = '';
let setup = { categories: null, perRound: 4, breaks: true, final: true };
const seen = new Set();
const timers = new Set();
const clearTimers = () => { timers.forEach(f => f()); timers.clear(); };
const hostApi = (method = 'GET', body) => api('host', { method, body, headers: { 'x-host-pin': pin } });

// ---------- auth + polling ----------
document.getElementById('gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  pin = document.getElementById('pin').value;
  try { await hostApi(); sessionStorage.setItem('pc_pin', pin); start(); }
  catch (err) { document.getElementById('gateErr').textContent = err.status === 401 ? 'That PIN doesn’t match HOST_PIN on the server.' : err.message; }
});

let started = false;
async function start() {
  if (started) return;
  started = true;
  document.getElementById('gate').style.display = 'none';
  await Clock.sync();
  setInterval(() => Clock.sync(), 60000);
  fetch('/api/qr').then(r => { joinUrl = r.headers.get('X-Join-Url') || location.origin + '/'; if (st && st.phase === 'lobby') render(true); });
  startPolling(() => hostApi(), s => { st = s; render(); }, {
    interval: 1000,
    onError: (e, n) => {
      if (e && e.status === 401) { sessionStorage.removeItem('pc_pin'); location.reload(); }
      $banner.style.display = e && n > 1 ? 'block' : 'none';
      if (e) $banner.textContent = e.status === 503 ? 'The database isn’t configured. Set DATABASE_URL in Vercel.' : 'Can’t reach the game server. Retrying…';
    }
  });
}
if (pin) hostApi().then(start, () => { sessionStorage.removeItem('pc_pin'); });

// ---------- controls ----------
let busy = false;
async function goNext() {
  if (busy || !st || setupMode || st.phase === 'none' || st.phase === 'final') return;
  busy = true; $next.disabled = true;
  try { await hostApi('POST', { action: 'next', v: st.v }); st = await hostApi(); render(); }
  catch (e) { flash(e.message); }
  finally { busy = false; $next.disabled = false; }
}
$next.addEventListener('click', () => { if (setupMode || !st || st.phase === 'none' || st.phase === 'final') return openSetup(); goNext(); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); if (!setupMode) goNext(); }
  if (e.key === 'f' || e.key === 'F') toggleFs();
});
const $menu = document.getElementById('menu'), $gear = document.getElementById('gear');
$gear.onclick = () => { const o = $menu.classList.toggle('open'); $gear.setAttribute('aria-expanded', o); };
function toggleFs() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
document.getElementById('fsBtn').onclick = () => { toggleFs(); $menu.classList.remove('open'); };
document.getElementById('newBtn').onclick = () => {
  $menu.classList.remove('open');
  if (st && st.phase !== 'none' && st.phase !== 'final' && !confirm('Set up a new game? The current game ends and scores reset. Player profiles stay.')) return;
  openSetup();
};
$main.addEventListener('click', async e => {
  const p = e.target.closest('.p[data-id]');
  if (p && confirm(`Remove “${p.dataset.name}” from the game? Their profile is deleted.`)) {
    try { await hostApi('POST', { action: 'kick', playerId: p.dataset.id }); } catch (err) { flash(err.message); }
  }
});
function flash(msg) { $banner.textContent = msg; $banner.style.display = 'block'; setTimeout(() => { $banner.style.display = 'none'; }, 4000); }

// ---------- render ----------
const LABEL = { lobby: 'Start game', slide: 'Next', question: 'Show answer', reveal: 'Next', leaderboard: 'Next', final: 'New game', none: 'Set up game' };

function render(force) {
  if (!st) return;
  if (st.phase === 'none' && !setupMode) setupMode = true;
  const s = st.slide;
  $stats.innerHTML = s && s.type === 'q' ? `Question <b>${s.num}</b> of ${s.total} &nbsp;&nbsp; <b>${st.players}</b> playing` : `<b>${st.players || 0}</b> playing`;
  $next.textContent = setupMode ? 'Create game' : LABEL[st.phase];
  $next.style.display = setupMode ? 'none' : '';

  const key = setupMode ? 'setup' : `${st.phase}:${st.id}:${st.idx}:${st.v}`;
  if (key === lastKey && !force) return patch();
  lastKey = key;
  clearTimers();
  ecgIdle($pulse);
  if (setupMode) return setupView();
  switch (st.phase) {
    case 'lobby': return lobbyView();
    case 'slide': return s.type === 'round' ? roundView(s) : breakView(s);
    case 'question': return questionView(s, false);
    case 'reveal': return questionView(s, true);
    case 'leaderboard': return boardView();
    case 'final': return finalView();
  }
}

function patch() {
  if (setupMode) return;
  if (st.phase === 'lobby') return paintWall();
  if (st.phase === 'question') {
    const a = document.getElementById('answered');
    if (a) a.textContent = st.answered || 0;
    maybeAutoReveal();
  }
}

// ---------- setup ----------
function openSetup() { setupMode = true; render(true); }

function setupView() {
  const bank = st.bank || [];
  if (!setup.categories) setup.categories = ['ai', 'cyber', 'cloud', 'careers', 'canada'].filter(id => bank.find(b => b.id === id && b.total));
  const qCount = setup.categories.length * setup.perRound + (setup.final ? 1 : 0);
  $main.innerHTML = `<section class="setup">
    <h1>Set up the game</h1>
    <p class="lede">Each category becomes a round. Questions are drawn from the least-used in the bank, and answer order is shuffled every game.</p>
    <div class="cats">${bank.map(b => `<button class="cat" data-id="${b.id}" aria-pressed="${setup.categories.includes(b.id)}" ${b.total ? '' : 'disabled'}>
      <span class="t">${esc(b.title)}</span><span class="b">${esc(b.blurb)}</span><span class="n">${b.total} questions, ${b.fresh} not used yet</span></button>`).join('')}</div>
    <div class="opts-row">
      <span>Questions per round <span class="seg" id="per">${[3, 4, 5].map(n => `<button data-n="${n}" aria-pressed="${setup.perRound === n}">${n}</button>`).join('')}</span></span>
      <label class="toggle"><input type="checkbox" id="breaks" ${setup.breaks ? 'checked' : ''}> Networking breaks</label>
      <label class="toggle"><input type="checkbox" id="final" ${setup.final ? 'checked' : ''}> Double-points final</label>
    </div>
    <button class="create" id="create" ${setup.categories.length ? '' : 'disabled'}>Create game</button>
    <span class="summary">${setup.categories.length} rounds, ${qCount} questions, about ${Math.round(qCount * 0.75 + 4)} minutes</span>
  </section>`;
  $main.querySelectorAll('.cat').forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    setup.categories = setup.categories.includes(id) ? setup.categories.filter(c => c !== id) : [...setup.categories, id];
    render(true);
  });
  $main.querySelectorAll('#per button').forEach(b => b.onclick = () => { setup.perRound = Number(b.dataset.n); render(true); });
  document.getElementById('breaks').onchange = e => { setup.breaks = e.target.checked; };
  document.getElementById('final').onchange = e => { setup.final = e.target.checked; render(true); };
  document.getElementById('create').onclick = async e => {
    e.target.disabled = true;
    try {
      await hostApi('POST', { action: 'new', settings: setup });
      setupMode = false; seen.clear();
      st = await hostApi(); render(true);
    } catch (err) { flash(err.message); e.target.disabled = false; }
  };
}

// ---------- lobby ----------
function lobbyView() {
  $main.innerHTML = `<section class="lobby">
    <div class="join">
      <h1 class="title">Pulse<br>Check</h1>
      <p class="lede2">Scan to make your player and join. No app, no sign-up.</p>
      <div class="qr"><img src="/api/qr" alt="QR code to join the game"></div>
      <div class="url">${esc(joinUrl || location.origin + '/')}</div>
    </div>
    <div class="wall"><div class="count" id="count"></div><div class="grid" id="grid"></div></div>
  </section>`;
  paintWall();
}

function paintWall() {
  const grid = document.getElementById('grid');
  if (!grid) return;
  const list = st.roster || [];
  document.getElementById('count').innerHTML = `<b>${st.players}</b>${st.players === 1 ? 'player is' : 'players are'} in`;
  if (!list.length) { grid.innerHTML = '<p class="empty">Players appear here as they join.</p>'; return; }
  const fit = Math.max(6, Math.floor((grid.clientWidth + 10) / 114) * Math.floor((grid.clientHeight + 14) / 136));
  const shown = list.slice(0, st.players > fit ? fit - 1 : fit);
  grid.innerHTML = shown.map(p => {
    const fresh = !seen.has(p.id);
    return `<button class="p${fresh ? ' new' : ''}" data-id="${esc(p.id)}" data-name="${esc(p.name)}" title="Remove ${esc(p.name)}">${avatarSvg(p.avatar, { size: 84 })}<span class="nm">${esc(p.name)}</span></button>`;
  }).join('');
  list.forEach(p => seen.add(p.id));
  if (st.players > shown.length) grid.insertAdjacentHTML('beforeend', `<span class="p"><span class="nm" style="font-size:20px;margin-top:30px">+${st.players - shown.length} more</span></span>`);
}

// ---------- cards ----------
function roundView(s) {
  $main.innerHTML = `<section class="card"><p class="sub">${esc(s.subtitle)}</p><h1>${esc(s.title)}</h1>${s.blurb ? `<p>${esc(s.blurb)}</p>` : ''}</section>`;
}
function breakView(s) {
  $main.innerHTML = `<section class="card brk"><h1>${esc(s.title)}</h1><p>${esc(s.text)}</p>${s.seconds ? '<div class="big-secs" id="bsecs"></div>' : ''}</section>`;
  if (s.seconds) {
    const el = document.getElementById('bsecs');
    timers.add(ecgCountdown($pulse, Clock.now() + s.seconds * 1000, s.seconds * 1000, sec => { el.textContent = sec > 0 ? sec : 'Time'; }));
  }
}

// ---------- question ----------
let autoFired = null;
function maybeAutoReveal() {
  if (!st || st.phase !== 'question' || autoFired === st.v) return;
  const allIn = st.players > 0 && (st.answered || 0) >= st.players && Clock.now() >= st.openAt;
  if (allIn || Clock.now() >= st.endsAt + 1200) { autoFired = st.v; goNext(); }
}

function tilesHtml(s, reveal) {
  const total = reveal ? st.reveal.counts.reduce((a, b) => a + b, 0) : 0;
  return s.options.map((o, i) => {
    const cls = reveal ? (i === st.reveal.answer ? 'right' : 'wrong') : '';
    const n = reveal ? st.reveal.counts[i] : '';
    const pct = reveal && total ? Math.round(st.reveal.counts[i] / total * 100) : 0;
    return `<div class="tile c${i} ${cls}" aria-label="${SHAPE_NAMES[i]}: ${esc(o)}">${SHAPES[i]}<span>${esc(o)}</span>${reveal ? `<span class="n">${n}</span><span class="fill" data-w="${pct}"></span>` : ''}</div>`;
  }).join('');
}

function questionView(s, reveal) {
  const meta = `<div class="q-meta"><span>${esc(s.catTitle || '')}</span>${s.double ? '<span class="dbl">Double points</span>' : ''}</div>`;
  if (!reveal && Clock.now() < st.openAt) {
    $main.innerHTML = `<section class="q reading">${meta}<div><h2 class="q-text">${esc(s.text)}</h2><p class="opening">Answers open in <b id="open"></b></p></div></section>`;
    const el = document.getElementById('open');
    timers.add(ecgCountdown($pulse, st.openAt, 3500, sec => { el.textContent = sec; }));
    timers.add(atServerTime(st.openAt, () => render(true)));
    return;
  }
  $main.innerHTML = `<section class="q">${meta}
    <div class="q-head"><h2 class="q-text">${esc(s.text)}</h2>
      ${reveal ? '' : `<div class="clock"><div class="secs" id="secs">${s.time}</div><div class="ans"><b id="answered">${st.answered || 0}</b> of ${st.players} answered</div></div>`}</div>
    <div style="display:grid;grid-template-rows:${reveal && st.reveal.fact ? 'auto 1fr' : '1fr'};gap:20px;min-height:0">
      ${reveal && st.reveal.fact ? `<p class="fact">${esc(st.reveal.fact)}</p>` : ''}
      <div class="tiles ${reveal ? 'reveal' : ''}" style="grid-template-rows:repeat(${Math.ceil(s.options.length / 2)},1fr)">${tilesHtml(s, reveal)}</div>
    </div></section>`;
  if (reveal) {
    requestAnimationFrame(() => requestAnimationFrame(() => $main.querySelectorAll('.fill').forEach(f => { f.style.width = f.dataset.w + '%'; })));
  } else {
    const secs = document.getElementById('secs');
    timers.add(ecgCountdown($pulse, st.endsAt, s.time * 1000, sec => { secs.textContent = sec; secs.classList.toggle('low', sec <= 5); }));
    const iv = setInterval(maybeAutoReveal, 250);
    timers.add(() => clearInterval(iv));
  }
}

// ---------- boards ----------
function boardView() {
  const t = st.top || [];
  $main.innerHTML = `<section class="board"><h2>Top ${t.length || 5} so far</h2>${t.map((p, i) =>
    `<div class="row"><span class="r">${i + 1}</span>${avatarSvg(p.avatar, { size: 60 })}<span>${esc(p.name)}</span><span class="s">${p.score.toLocaleString()}</span></div>`).join('') || '<p class="empty">No players yet.</p>'}</section>`;
}

function finalView() {
  const t = st.top || [];
  if (!t.length) { $main.innerHTML = '<section class="board"><h2>Game over</h2><p class="empty">No one played this time.</p></section>'; return; }
  const win = (p, place, cls) => p ? `<div class="win ${cls}">${avatarSvg(p.avatar, { size: 200 })}<div class="place">${place}</div><div class="name">${esc(p.name)}</div><div class="pts">${p.score.toLocaleString()} points</div></div>` : '<div></div>';
  const rest = t.slice(2).map((p, i) => `<span><b>${i + 3}.</b>${avatarSvg(p.avatar, { size: 40 })}${esc(p.name)} (${p.score.toLocaleString()})</span>`).join('');
  $main.innerHTML = `<section class="final"><h2>Our winners. Come up and claim your prize.</h2>
    ${win(t[0], '1st place', 'first')}${win(t[1], '2nd place', 'second')}${rest ? `<div class="runners">${rest}</div>` : ''}</section>`;
}
</script>
</body>
</html>
