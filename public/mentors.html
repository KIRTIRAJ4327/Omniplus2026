<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4E">
<title>Meet the mentors at Omni Pulse Tech 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  body { background: var(--paper); }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(22px + env(safe-area-inset-top, 0px)) 20px calc(32px + env(safe-area-inset-bottom, 0px)); }
  .head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 4px; }
  .head .art { color: var(--navy); flex: none; margin-top: 2px; }
  h1 { font-size: 40px; line-height: .95; font-weight: 900; font-stretch: 125%; margin: 0 0 8px; letter-spacing: -.01em; }
  .lede { font-size: 17px; line-height: 1.45; color: var(--muted); margin: 0 0 24px; }
  .pulse-strip { height: 30px; margin: 0 -20px 22px; color: var(--navy); }

  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  li { animation: fade-up .4s ease-out backwards; }
  .m { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 14px 16px; text-decoration: none; color: var(--navy); box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(27,42,78,.06); }
  .m:active { transform: scale(.99); }
  .ini { flex: none; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 900; font-stretch: 112%; background: var(--navy); color: #fff; }
  li:nth-child(3n+2) .ini { background: var(--a1); }
  li:nth-child(3n+3) .ini { background: var(--a3); }
  .txt { flex: 1; min-width: 0; }
  .nm { display: block; font-size: 18px; font-weight: 800; line-height: 1.15; }
  .ti { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; line-height: 1.3; }
  .go { flex: none; font-size: 14px; font-weight: 800; color: var(--pulse); display: inline-flex; align-items: center; gap: 5px; }
  .go svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

  .state { font-size: 17px; line-height: 1.5; color: var(--muted); background: #fff; border-radius: 16px; padding: 20px; }
  .state b { color: var(--navy); }
  .foot { margin-top: 26px; font-size: 14px; color: var(--muted); line-height: 1.5; }
  .foot a { color: var(--a1); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div id="art"></div>
    <div>
      <h1>Meet the<br>mentors.</h1>
    </div>
  </div>
  <p class="lede">Tap a name to open their LinkedIn. Send the request while you're still in the room &mdash; they'll remember you.</p>
  <div class="pulse-strip" id="pulse"></div>
  <div id="list"><p class="state">Loading the list&hellip;</p></div>
  <p class="foot">Omni Pulse Tech 2026 &middot; <a href="/">Back to Pulse Check</a></p>
</div>

<script src="/art.js"></script>
<script src="/common.js"></script>
<script>
document.getElementById('art').innerHTML = categoryArt('careers', { width: 92 });
document.getElementById('pulse').innerHTML = ecgSvg();

const initials = name => name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M12 6l6 6-6 6"/></svg>';

(async () => {
  const list = document.getElementById('list');
  try {
    const { mentors } = await api('mentors');
    if (!mentors.length) {
      list.innerHTML = `<p class="state">The mentor links aren't up yet. <b>Check back at the end of the quiz</b> &mdash; the host adds them from the projector screen.</p>`;
      return;
    }
    list.innerHTML = `<ul>${mentors.map((m, i) => `<li style="animation-delay:${Math.min(i * 45, 500)}ms">
      <a class="m" href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">
        <span class="ini" aria-hidden="true">${esc(initials(m.name))}</span>
        <span class="txt"><span class="nm">${esc(m.name)}</span>${m.title ? `<span class="ti">${esc(m.title)}</span>` : ''}</span>
        <span class="go">Open${ARROW}</span>
      </a></li>`).join('')}</ul>`;
  } catch (e) {
    list.innerHTML = `<p class="state">Couldn't load the list. <b>Pull down to refresh</b>, or ask at the host desk.</p>`;
  }
})();
</script>
</body>
</html>
